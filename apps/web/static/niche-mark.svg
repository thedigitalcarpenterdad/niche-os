<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Niche Waterproofing">
  <rect width="64" height="64" rx="14" fill="#08304A"/>
  <g stroke="#08304A" stroke-width="1.4" stroke-linejoin="round">
    <!-- three stacked slabs, isometric: yellow front face + darker top face -->
    <polygon points="14,23 38,19 47,21 23,25" fill="#16466A"/>
    <polygon points="14,23 23,25 23,30 14,28" fill="#FCD74B"/>
    <polygon points="23,25 47,21 47,26 23,30" fill="#16466A"/>

    <polygon points="14,32 38,28 47,30 23,34" fill="#16466A"/>
    <polygon points="14,32 23,34 23,39 14,37" fill="#FCD74B"/>
    <polygon points="23,34 47,30 47,35 23,39" fill="#16466A"/>

    <polygon points="14,41 38,37 47,39 23,43" fill="#16466A"/>
    <polygon points="14,41 23,43 23,48 14,46" fill="#FCD74B"/>
    <polygon points="23,43 47,39 47,44 23,48" fill="#16466A"/>
  </g>
</svg>
